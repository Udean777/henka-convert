<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				const theme = localStorage.getItem('henka-theme');
				const language = localStorage.getItem('henka-language');
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (theme === 'dark' || (theme !== 'light' && prefersDark)) {
					document.documentElement.classList.add('dark');
				}
				if (language === 'id' || language === 'en') {
					document.documentElement.lang = language;
				}
			} catch {
				// Preferences are optional; the app remains usable when storage is unavailable.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
